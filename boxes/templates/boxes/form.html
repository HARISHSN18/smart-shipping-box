{% extends "boxes/base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:640px"><div class="card-body">
<h1 class="h4 mb-3">{{ title }}</h1>
<form method="post" novalidate>{% csrf_token %}
<div class="row g-3">{% for f in form %}<div class="col-md-{% if forloop.first %}12{% else %}6{% endif %}">
<label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}</div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-outline-secondary" href="{% url back %}">Cancel</a></div>
</form></div></div>
{% endblock %}
