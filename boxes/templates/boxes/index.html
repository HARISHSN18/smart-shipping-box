{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Selector – pick the right box for every order</title>
<link rel="stylesheet" href="{% static 'boxes/style.css' %}">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Box Selector</h1>
    <p>Add what’s in the order. We’ll find the cheapest box that actually fits it.</p>
  </div>
</header>

<main class="wrap layout">
  <section class="panel" aria-labelledby="items-h">
    <h2 id="items-h">Order items</h2>
    <div id="items"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="add">Add item</button>
      <button type="button" class="btn primary" id="go">Find best box</button>
    </div>
    <p class="hint">Sizes in cm, weight in kg. Fragile items get extra padding.</p>
  </section>

  <section class="panel result" aria-live="polite" aria-labelledby="res-h">
    <h2 id="res-h">Recommendation</h2>
    <div id="result">
      <div class="empty">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path d="M8 20 32 8l24 12v26L32 58 8 46z M8 20l24 12 24-12 M32 32v26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <p>Your recommended box will appear here.</p>
      </div>
    </div>
  </section>
</main>

<script src="{% static 'boxes/app.js' %}"></script>
</body>
</html>
