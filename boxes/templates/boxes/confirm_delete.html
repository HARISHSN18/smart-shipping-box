{% extends "boxes/base.html" %}{% block title %}Delete{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:520px"><div class="card-body">
<h1 class="h4">Delete “{{ object }}”?</h1><p class="text-muted">This cannot be undone.</p>
<form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, delete</button> <a class="btn btn-outline-secondary" href="{% url back %}">Cancel</a></form>
</div></div>
{% endblock %}
